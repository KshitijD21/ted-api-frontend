<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #000;
            color: #fff;
        }
        video {
            width: 100%;
            border: 2px solid #333;
            border-radius: 8px;
            margin: 20px 0;
        }
        .info {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
        button {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        .status {
            padding: 10px;
            background: #222;
            border-radius: 6px;
            margin: 10px 0;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>🎥 Video Player Test</h1>

    <div class="info">
        <strong>Testing Video URL:</strong><br>
        <span id="videoUrl">https://storage.googleapis.com/overview-storage2/slides_with_audio.mp4</span>
    </div>

    <div class="status" id="status">
        Loading...
    </div>

    <video id="testVideo" controls crossorigin="anonymous" preload="metadata">
        <source src="https://storage.googleapis.com/overview-storage2/slides_with_audio.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div>
        <button onclick="playVideo()">▶️ Play</button>
        <button onclick="pauseVideo()">⏸️ Pause</button>
        <button onclick="testBackendAPI()">🔄 Test Backend API</button>
        <button onclick="testDirectURL()">🌐 Test Direct URL</button>
    </div>

    <div class="info">
        <strong>Console Logs:</strong>
        <div id="logs" style="margin-top: 10px;"></div>
    </div>

    <script>
        const video = document.getElementById('testVideo');
        const statusDiv = document.getElementById('status');
        const logsDiv = document.getElementById('logs');

        function log(message, isError = false) {
            console.log(message);
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEntry.className = isError ? 'error' : 'success';
            logsDiv.insertBefore(logEntry, logsDiv.firstChild);
        }

        // Video event listeners
        video.addEventListener('loadstart', () => {
            log('📥 Video loading started...');
            statusDiv.textContent = '📥 Loading video...';
        });

        video.addEventListener('loadedmetadata', () => {
            log('✅ Video metadata loaded successfully');
            log(`Duration: ${video.duration.toFixed(2)} seconds`);
            log(`Dimensions: ${video.videoWidth} x ${video.videoHeight}`);
            statusDiv.innerHTML = '<span class="success">✅ Video loaded successfully!</span>';
        });

        video.addEventListener('canplay', () => {
            log('✅ Video can start playing');
        });

        video.addEventListener('playing', () => {
            log('▶️ Video is playing');
            statusDiv.innerHTML = '<span class="success">▶️ Video is playing</span>';
        });

        video.addEventListener('pause', () => {
            log('⏸️ Video paused');
            statusDiv.textContent = '⏸️ Video paused';
        });

        video.addEventListener('error', (e) => {
            const error = video.error;
            let errorMessage = 'Unknown error';

            if (error) {
                switch(error.code) {
                    case error.MEDIA_ERR_ABORTED:
                        errorMessage = 'Video loading aborted';
                        break;
                    case error.MEDIA_ERR_NETWORK:
                        errorMessage = 'Network error while loading video';
                        break;
                    case error.MEDIA_ERR_DECODE:
                        errorMessage = 'Video decoding failed';
                        break;
                    case error.MEDIA_ERR_SRC_NOT_SUPPORTED:
                        errorMessage = 'Video format not supported';
                        break;
                }
            }

            log(`❌ Video Error: ${errorMessage}`, true);
            statusDiv.innerHTML = `<span class="error">❌ Error: ${errorMessage}</span>`;
        });

        function playVideo() {
            video.play()
                .then(() => log('✅ Play successful'))
                .catch(err => log(`❌ Play failed: ${err.message}`, true));
        }

        function pauseVideo() {
            video.pause();
        }

        async function testBackendAPI() {
            log('🔄 Testing backend /video-status endpoint...');
            try {
                const response = await fetch('http://localhost:8200/video-status');
                const data = await response.json();
                log('✅ Backend API Response:');
                log(JSON.stringify(data, null, 2));
                statusDiv.innerHTML = `<span class="success">✅ Backend API working</span>`;
            } catch (err) {
                log(`❌ Backend API failed: ${err.message}`, true);
                statusDiv.innerHTML = `<span class="error">❌ Backend API failed</span>`;
            }
        }

        async function testDirectURL() {
            log('🌐 Testing direct video URL access...');
            try {
                const response = await fetch('https://storage.googleapis.com/overview-storage2/slides_with_audio.mp4', {
                    method: 'HEAD'
                });
                log(`✅ Direct URL accessible (Status: ${response.status})`);
                log(`Content-Type: ${response.headers.get('content-type')}`);
                log(`Content-Length: ${response.headers.get('content-length')} bytes`);
                statusDiv.innerHTML = `<span class="success">✅ Direct URL accessible</span>`;
            } catch (err) {
                log(`❌ Direct URL failed: ${err.message}`, true);
                statusDiv.innerHTML = `<span class="error">❌ Direct URL failed</span>`;
            }
        }

        // Initial log
        log('🚀 Video test page loaded');
    </script>
</body>
</html>
